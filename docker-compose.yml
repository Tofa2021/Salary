services:
    db:
        image: postgres:16-alpine
        container_name: salary_data_base
        restart: always
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "5433:5432"
        volumes:
            - data_base_data:/var/lib/postgresql/data

volumes:
    data_base_data: