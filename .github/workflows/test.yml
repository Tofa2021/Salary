name: Java CI with Maven

on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Configure Docker Java Property
      run: echo "api.version=1.44" > $HOME/.docker-java.properties

    - name: Run tests with Maven
      run: mvn clean test -ntp
      working-directory: ./backend
      env:
        DOCKER_API_VERSION: "1.44"
        TESTCONTAINERS_RYUK_DISABLED: "true"
        TESTCONTAINERS_DOCKER_CLIENT_STRATEGY: "org.testcontainers.dockerclient.UnixSocketClientProviderStrategy"
