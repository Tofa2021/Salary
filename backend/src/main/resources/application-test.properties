spring.datasource.url=jdbc:tc:postgresql:16:///testdb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true

auth.jwt.secret=test-secret-key-for-tests-only-must-be-at-least-32-bytes-long
auth.jwt.access-ttl=PT15M
auth.refresh.ttl=P7D

app.bootstrap.admin.username=admin
app.bootstrap.admin.password=admin123